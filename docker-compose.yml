services:
  magnific-ledger:
    build: .
    container_name: emc-magnific-ledger
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 必填：NAS 的網址，必須與同事／你在瀏覽器輸入的一致（授權完成後會導回此處）
      PUBLIC_URL: "http://192.168.1.50:8080"
      # 必填：管理員密碼（連接 Magnific、同步、修改歸屬需要）
      ADMIN_PASSWORD: "請改成自己的密碼"
      SESSION_SECRET: "請改成一串隨機文字"
      SYNC_INTERVAL_MIN: "60"   # 自動同步間隔（分鐘）
      SYNC_RECENT_DAYS: "3"     # 每次增量同步回看天數
      TZ: Asia/Taipei
    volumes:
      - ./data:/data
